<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fodinha">
  <meta name="theme-color" content="#06261C">
  <link rel="apple-touch-icon" href="TemplateData/icone.png">
  <link rel="icon" type="image/png" href="TemplateData/icone.png">
  <title>Fodinha Online</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #06261C;
                 -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: none; }
    /* Retrato: no celular ocupa a tela toda; no PC fica uma "tela de celular" centralizada. */
    #unity-canvas { position: absolute; top: 0; bottom: 0; left: 50%; transform: translateX(-50%);
                    height: 100%; width: min(100vw, calc(100vh * 9 / 16)); background: #06261C; display: block; }
    @media (max-aspect-ratio: 3/4) { #unity-canvas { width: 100vw; } }
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
               color: #FFC83D; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    #loading h1 { font-size: 44px; margin: 0 0 6px 0; letter-spacing: 2px; }
    #loading p { color: #ffffffaa; margin: 0 0 24px 0; font-size: 16px; }
    #bar { width: 60vw; max-width: 320px; height: 12px; border-radius: 6px; background: #ffffff22; overflow: hidden; }
    #fill { height: 100%; width: 0%; background: #FFC83D; transition: width 0.2s; }
    #erro { color: #ff8080; padding: 24px; text-align: center; display: none; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading">
    <h1>FODINHA</h1>
    <p>Carregando o jogo...</p>
    <div id="bar"><div id="fill"></div></div>
    <div id="erro"></div>
  </div>
  <script src="Build/d3980e86c966dfe2539548c946e50085.loader.js"></script>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var config = {
      dataUrl: "Build/23418f55e5ba551757eb052d2057455b.data.gz",
      frameworkUrl: "Build/419165b16dc274a2803e86bfbe70d1d8.framework.js.gz",
      codeUrl: "Build/7e568a6f03eb7cfeb53f7e8117d87efa.wasm.gz",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Fodinha Online",
      productName: "Fodinha Online",
      productVersion: "0.1.0",
      matchWebGLToCanvasSize: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    };
    createUnityInstance(canvas, config, function (progress) {
      document.querySelector("#fill").style.width = (100 * progress) + "%";
    }).then(function () {
      document.querySelector("#loading").style.display = "none";
    }).catch(function (message) {
      var e = document.querySelector("#erro");
      e.style.display = "block";
      e.textContent = "Não foi possível abrir o jogo: " + message;
    });
  </script>
</body>
</html>
